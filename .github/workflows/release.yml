name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish command with --dry-run
        required: true
        type: boolean
        default: true
      create_github_release:
        description: Create a GitHub release when dispatching from a tag
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run check

      - name: Build package artifacts
        run: npm run build:lib

      - name: Test
        run: npm run test:ci

      - name: Pack package
        shell: bash
        run: |
          package_tgz="$(npm pack --ignore-scripts --silent)"
          echo "PACKAGE_TGZ=${package_tgz}" >> "$GITHUB_ENV"
          echo "Packed ${package_tgz}"

      - name: Publish to npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          args=(--access public)
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm publish "${PACKAGE_TGZ}" "${args[@]}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.inputs.create_github_release == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${PACKAGE_TGZ}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${PACKAGE_TGZ}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

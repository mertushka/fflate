name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - scripts/bench*.mjs
      - package.json
      - package-lock.json
      - .github/workflows/benchmark.yml
  push:
    branches:
      - master
      - main
    paths:
      - src/**
      - scripts/bench*.mjs
      - package.json
      - package-lock.json
      - .github/workflows/benchmark.yml

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmark suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package artifacts
        run: npm run build:lib

      - name: Run Node inflate benchmark
        run: |
          npm run bench:inflate -- --runtime node --json benchmark-inflate-node.json --markdown benchmark-inflate-node.md
          cat benchmark-inflate-node.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Node compression benchmark
        run: |
          npm run bench:compression -- --json benchmark-compression-node.json --markdown benchmark-compression-node.md
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-compression-node.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Node ZIP benchmark
        run: |
          npm run bench:zip -- --json benchmark-zip-node.json --markdown benchmark-zip-node.md
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-zip-node.md >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Chrome
        id: chrome
        shell: bash
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            echo "bin=$(command -v google-chrome-stable)" >> "$GITHUB_OUTPUT"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "bin=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          elif command -v chromium >/dev/null 2>&1; then
            echo "bin=$(command -v chromium)" >> "$GITHUB_OUTPUT"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "bin=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Chrome benchmark
        if: steps.chrome.outputs.bin != ''
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          npm run bench:inflate -- --runtime browser --json benchmark-inflate-browser.json --markdown benchmark-inflate-browser.md
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-inflate-browser.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmarks
          path: |
            benchmark-*.json
            benchmark-*.md
          if-no-files-found: error
